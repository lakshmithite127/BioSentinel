<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 48" width="100" height="48" fill="none">
  <defs>
    <!-- Right Chamber Clip: strictly confines all artwork to the right half and the rounded right cap -->
    <clipPath id="right-chamber-clip">
      <path d="M 50,2 L 76,2 A 22,22 0 0,1 98,24 A 22,22 0 0,1 76,46 L 50,46 Z" />
    </clipPath>
  </defs>

  <!-- Left Chamber & Base Fill: Pure, solid white across the entire capsule -->
  <rect x="2" y="2" width="96" height="44" rx="22" ry="22" fill="#ffffff" />

  <!-- Right Chamber: Entire colorful logo design completely enclosed on the right side -->
  <g clip-path="url(#right-chamber-clip)">
    <!-- Clinical Teal Base Background -->
    <rect x="50" y="2" width="48" height="44" fill="#0d9488" />

    <!-- Whole Concentric Telemetry Target (Yellow, Orange, Blue, Core) centered in right chamber -->
    <circle cx="74" cy="24" r="20" stroke="#111827" stroke-width="2.5" fill="#f59e0b" />
    <circle cx="74" cy="24" r="15" stroke="#111827" stroke-width="2.5" fill="#ea580c" />
    <circle cx="74" cy="24" r="10" stroke="#111827" stroke-width="2.5" fill="#0284c7" />
    <circle cx="74" cy="24" r="5" stroke="#111827" stroke-width="2.5" fill="#111827" />

    <!-- Telemetry Curved Waves on Lateral Edges -->
    <path d="M 54,2 C 60,10 60,38 54,46" stroke="#111827" stroke-width="2.5" fill="none" />
    <path d="M 94,6 C 88,14 88,34 94,42" stroke="#111827" stroke-width="2.5" fill="none" />
  </g>

  <!-- Center Vertical Divider Line -->
  <line x1="50" y1="2" x2="50" y2="46" stroke="#111827" stroke-width="4" stroke-linecap="round" />

  <!-- Outer Pill Border (rendered on top so the black contour is crisp, solid, and seamless) -->
  <rect x="2" y="2" width="96" height="44" rx="22" ry="22" stroke="#111827" stroke-width="4" fill="none" />
</svg>
